<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline — Stayable Operations</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: #0f172a;
        color: #f8fafc;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      .card { max-width: 22rem; }
      h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
      p { margin: 0 0 1.5rem; color: #94a3b8; font-size: 0.95rem; line-height: 1.5; }
      button {
        appearance: none;
        border: 0;
        border-radius: 0.625rem;
        background: #f8fafc;
        color: #0f172a;
        font-weight: 600;
        font-size: 1rem;
        padding: 0.875rem 1.5rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>
        Stayable Operations can't reach the network right now. Any draft you were
        filling out is saved on this device and will sync when you reconnect.
      </p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
